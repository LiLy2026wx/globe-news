name: Daily News Refresh & Push

on:
  schedule:
    # 三个错峰冗余时段，规避 UTC 整点高峰跳过率。
    # 任一时段命中即推送；后续时段读 .last-push-date 短路。
    - cron: '47 23 * * *'   # BJT 07:47
    - cron: '23 0 * * *'    # BJT 08:23
    - cron: '47 0 * * *'    # BJT 08:47
  workflow_dispatch:
    inputs:
      force_push:
        description: '手动触发时是否也发微信推送（默认只刷数据不推送）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch news → news-data.json
        run: python fetcher.py

      - name: Commit data if changed
        run: |
          git add news-data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh news $(TZ='Asia/Shanghai' date +%Y-%m-%dT%H:%M%z)"
            git push
          fi

      - name: Check if already pushed today (BJT)
        id: idempotency
        run: |
          today=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          want_push="${{ github.event_name == 'schedule' || inputs.force_push == true }}"
          if [ "$want_push" != "true" ]; then
            echo "Manual run without force_push → skipping WeChat."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f .last-push-date ] && [ "$(cat .last-push-date)" = "$today" ]; then
            echo "Already pushed today ($today) — earlier cron slot won. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Will push for $today."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "today=$today" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to WeChat (Server酱)
        if: steps.idempotency.outputs.skip == 'false'
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python push.py

      - name: Commit push marker
        if: steps.idempotency.outputs.skip == 'false'
        run: |
          echo "${{ steps.idempotency.outputs.today }}" > .last-push-date
          git add .last-push-date
          git commit -m "chore: pushed for ${{ steps.idempotency.outputs.today }}"
          git push
