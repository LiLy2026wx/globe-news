name: Daily News Refresh

# 纯抓取+提交。前端走 CF Pages 网页访问，微信推送已下线（2026-05-29）。
# 多档错峰冗余 cron，规避 GitHub 免费公共仓库 schedule 的高跳过率；
# 任一时段命中即可，commit-if-changed 天然幂等（数据没变就不提交、不部署）。

on:
  schedule:
    - cron: '31 23 * * *'   # BJT 07:31
    - cron: '53 23 * * *'   # BJT 07:53
    - cron: '17 0 * * *'    # BJT 08:17
    - cron: '41 0 * * *'    # BJT 08:41
    - cron: '13 1 * * *'    # BJT 09:13
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch news → news-data.json
        run: python fetcher.py

      - name: Commit data if changed
        run: |
          git add news-data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh news $(TZ='Asia/Shanghai' date +%Y-%m-%dT%H:%M%z)"
            git push
          fi
