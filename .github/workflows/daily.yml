name: Daily News Refresh & Push

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: '0 0 * * *'
  workflow_dispatch:   # manual trigger button in GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push the data commit back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch news → news-data.json
        run: python fetcher.py

      - name: Commit if data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): refresh news $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to WeChat (Server酱)
        # Only push on scheduled runs, not on every manual dispatch.
        # Set MANUAL_PUSH=1 in workflow_dispatch inputs in the future if needed.
        if: github.event_name == 'schedule'
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python push.py
