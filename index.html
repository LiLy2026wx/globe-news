<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新闻地球仪 · MVP</title>
<style>
  :root {
    --bg: #050810;
    --panel-bg: rgba(10, 14, 22, 0.88);
    --gold: #c9a96e;
    --text: #e8e6df;
    --text-dim: #8a8780;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  #globe { position: fixed; inset: 0; }

  #panel {
    position: fixed; top: 0; right: 0;
    width: min(440px, 88vw); height: 100vh;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-left: 1px solid var(--border);
    padding: 28px 28px 60px;
    overflow-y: auto;
    z-index: 10;
    transition: transform 0.3s ease;
  }
  #panel.collapsed { transform: translateX(100%); }

  @media (max-width: 768px) {
    #panel { padding: 20px 20px 50px; }
    #toggle {
      background: rgba(201, 169, 110, 0.18) !important;
      border-color: rgba(201, 169, 110, 0.35) !important;
      padding: 10px 16px;
      font-size: 12px;
    }
  }

  .brand {
    font-size: 12px; letter-spacing: 4px; color: var(--gold);
    text-transform: uppercase; margin-bottom: 4px;
  }
  h1 {
    font-size: 20px; margin: 0 0 6px; font-weight: 400;
    letter-spacing: 1px;
  }
  .sub {
    font-size: 11px; color: var(--text-dim);
    margin-bottom: 28px; letter-spacing: 0.5px;
  }

  #region {
    font-size: 26px; font-weight: 300;
    margin: 0 0 20px; color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  #region .iso {
    font-size: 11px; color: var(--gold);
    letter-spacing: 3px; display: block;
    margin-bottom: 6px;
  }
  #region .hint {
    font-size: 11px; color: var(--text-dim);
    display: block; margin-top: 8px;
    font-weight: 400; letter-spacing: 0.5px;
  }
  #region .nav {
    display: inline-block; margin-top: 12px; font-size: 11px;
    color: var(--gold); cursor: pointer; letter-spacing: 1px;
    border: 1px solid rgba(201, 169, 110, 0.35); border-radius: 2px;
    padding: 5px 11px; font-weight: 400;
    transition: background 0.2s, color 0.2s;
  }
  #region .nav:hover { background: rgba(201, 169, 110, 0.12); color: #fff; }

  .cat { margin: 0 0 22px; }
  .cat h2 {
    font-size: 11px; color: var(--gold);
    margin: 0 0 10px; letter-spacing: 3px;
    font-weight: 500;
  }
  .cat h2 .count {
    color: var(--text-dim); margin-left: 8px;
    font-weight: 400;
  }
  .news-item {
    display: block; text-decoration: none;
    font-size: 13px; line-height: 1.65;
    margin-bottom: 10px; color: #cfccc4;
    padding: 8px 0 8px 14px;
    border-left: 1px solid #2a2a2a;
    transition: border-color 0.2s, color 0.2s;
    cursor: pointer;
  }
  .news-item:hover {
    border-left-color: var(--gold);
    color: var(--text);
  }
  .news-item .time {
    font-size: 10px; color: var(--text-dim);
    display: block; margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .empty {
    color: #4a4a4a; font-size: 12px;
    font-style: italic; padding: 4px 0 4px 14px;
  }

  #toggle {
    position: fixed; top: 16px; right: 16px;
    z-index: 20;
    background: rgba(10, 14, 22, 0.7);
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 8px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 2px;
    backdrop-filter: blur(8px);
  }
  #toggle:hover { background: rgba(201, 169, 110, 0.1); }

  #status {
    position: fixed; bottom: 16px; left: 16px;
    z-index: 20;
    font-size: 10px; color: var(--text-dim);
    letter-spacing: 1px;
  }
  #status .dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--gold); border-radius: 50%;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  #status.live .dot { background: #4ade80; }
  #status .refresh {
    margin-left: 14px; color: var(--gold); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  #status .refresh:hover { color: #fff; }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Scrollbar */
  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-track { background: transparent; }
  #panel::-webkit-scrollbar-thumb {
    background: rgba(201, 169, 110, 0.2);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div id="globe"></div>

<button id="toggle">隐藏面板</button>

<div id="panel">
  <div class="brand">DAILY GLOBE</div>
  <h1>每日新闻地球仪</h1>
  <div class="sub">点击国家查看新闻 · 重点国家可下钻省/州</div>

  <div id="region">
    <span class="iso">— 等待选择 —</span>
    请点击地球上任意国家
    <span class="hint">鼠标左键拖动旋转 · 滚轮缩放</span>
  </div>

  <div id="news"></div>
</div>

<div id="status"><span class="dot"></span><span id="status-text">加载中…</span><span class="refresh" id="refresh-btn">刷新</span></div>

<script src="vendor/globe.gl.min.js"></script>
<script src="news-data.js"></script>
<script>
  let world = null;
  let selectedFeat = null;
  let allCountries = null;

  // 下钻状态：'global' = 国家级；'cn' = 中国省级
  let viewMode = 'global';
  let cnGeo = null;    // 中国省界 geojson（首次下钻时加载并缓存）
  let cnNews = null;   // news-cn.json（同上）

  const CATEGORIES = [
    ['政治', 'politics'],
    ['军事', 'military'],
    ['经济', 'economy'],
    ['科技', 'technology'],
    ['航空', 'aviation'],
  ];

  // Bar color by dominant news category (low-saturation, brand-aligned palette)
  const CATEGORY_COLORS = {
    politics:   'rgba(212, 137,  78, 0.88)',  // 暖铁锅
    military:   'rgba(140, 148, 158, 0.88)',  // 暗银
    economy:    'rgba(201, 169, 110, 0.88)',  // 品牌金棕
    technology: 'rgba(106, 154, 178, 0.88)',  // 冷青
    aviation:   'rgba(130, 175, 165, 0.88)',  // 薄荷
  };

  // Toggle panel
  document.getElementById('toggle').addEventListener('click', () => {
    const panel = document.getElementById('panel');
    panel.classList.toggle('collapsed');
    document.getElementById('toggle').textContent =
      panel.classList.contains('collapsed') ? '显示面板' : '隐藏面板';
  });

  // On mobile, default to collapsed so the globe is visible first
  if (window.innerWidth <= 768) {
    document.getElementById('panel').classList.add('collapsed');
    document.getElementById('toggle').textContent = '显示面板';
  }

  // Load real news (from server) — fall back to inline NEWS_DATA if server hasn't generated yet
  const newsReady = fetch('news-data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(json => {
      if (json && typeof json === 'object') {
        // Overlay server data on top of any inline fallback
        for (const k of Object.keys(json)) {
          if (k.startsWith('_')) continue;
          NEWS_DATA[k] = json[k];
        }
        updateStatus(json._generated, true);
      } else {
        updateStatus(null, false);
      }
    })
    .catch(() => updateStatus(null, false));

  // Load country GeoJSON in parallel
  const geoReady = fetch('assets/countries.geojson')
    .then(r => r.json());

  Promise.all([newsReady, geoReady])
    .then(([_, countries]) => {
      allCountries = countries;
      initGlobe(countries);
    })
    .catch(err => {
      document.getElementById('region').innerHTML =
        `<span class="iso">— 网络错误 —</span>无法加载地球数据<span class="hint">${err.message}</span>`;
    });

  function updateStatus(generatedIso, live) {
    const el = document.getElementById('status');
    const txt = document.getElementById('status-text');
    if (live && generatedIso) {
      const t = new Date(generatedIso);
      const hhmm = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      txt.textContent = `今日数据 · 更新于 ${hhmm}`;
      el.classList.add('live');
      window._isLive = true;
    } else {
      txt.textContent = '静态演示数据（服务端首次抓取中…）';
      el.classList.remove('live');
      window._isLive = false;
    }
  }

  // Poll for fresh data if first load missed it
  setInterval(() => {
    if (window._isLive) return;
    fetch('news-data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if (json && typeof json === 'object') {
          for (const k of Object.keys(json)) {
            if (k.startsWith('_')) continue;
            NEWS_DATA[k] = json[k];
          }
          updateStatus(json._generated, true);
          refreshBars();
          if (selectedFeat) reshowSelected();
        }
      })
      .catch(() => {});
  }, 20000);

  document.getElementById('refresh-btn').addEventListener('click', () => {
    document.getElementById('status-text').textContent = '正在刷新…';
    fetch('news-data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if (!json) {
          updateStatus(null, false);
          return;
        }
        for (const k of Object.keys(json)) {
          if (k.startsWith('_')) continue;
          NEWS_DATA[k] = json[k];
        }
        updateStatus(json._generated, true);
        refreshBars();
        if (selectedFeat) reshowSelected();
      })
      .catch(() => updateStatus(null, false));
  });

  function initGlobe(countries) {
    world = Globe()(document.getElementById('globe'))
      .globeImageUrl('assets/earth-night.jpg')
      .bumpImageUrl('assets/earth-topology.png')
      .backgroundImageUrl('assets/night-sky.png')
      .showAtmosphere(true)
      .atmosphereColor('#6a8aaf')
      .atmosphereAltitude(0.18)
      .polygonsData(countries.features.filter(f => f.properties.ISO_A2 !== 'AQ'))
      // 关键：关掉多边形过渡动画。否则切换到省级面时 globe.gl 会在 1s 过渡里
      // 每帧重新三角化所有面，手机主线程直接卡死。
      .polygonsTransitionDuration(0)
      .polygonAltitude(f => f === selectedFeat ? 0.06 : 0.006)
      .polygonCapColor(f => f === selectedFeat
        ? 'rgba(201, 169, 110, 0.55)'
        : (hasNews(f) ? 'rgba(201, 169, 110, 0.12)' : 'rgba(255, 255, 255, 0.02)'))
      .polygonSideColor(() => 'rgba(201, 169, 110, 0.08)')
      .polygonStrokeColor(() => 'rgba(255, 255, 255, 0.18)')
      .polygonLabel(({properties: d}) => `
        <div style="background:rgba(5,8,16,0.92);padding:6px 10px;border-radius:2px;font-size:12px;border:1px solid rgba(201,169,110,0.3);color:#e8e6df;">
          <div style="color:#c9a96e;font-size:10px;letter-spacing:2px;">${d.ISO_A2 || (d.level === 'province' ? '中国' : '')}</div>
          ${d.ADMIN || d.NAME || d.name || ''}
        </div>
      `)
      .onPolygonClick(feat => {
        if (viewMode === 'cn') selectProvince(feat);
        else selectCountry(feat);
      })
      // News-density bars: height = total news count, color = dominant category
      .pointsData(buildBars(countries))
      .pointLat('lat')
      .pointLng('lng')
      .pointAltitude('altitude')
      .pointRadius(0.5)
      .pointColor('color')
      .pointResolution(12)
      .pointsMerge(false)
      .pointLabel(d => `
        <div style="background:rgba(5,8,16,0.92);padding:6px 10px;border-radius:2px;font-size:12px;border:1px solid rgba(201,169,110,0.3);color:#e8e6df;">
          <div style="color:#c9a96e;font-size:10px;letter-spacing:2px;">${d.country}</div>
          热度 ${d.intensity} · 主导：${d.dominantLabel}
        </div>
      `);

    // Initial view
    world.pointOfView({ lat: 30, lng: 110, altitude: 2.5 }, 0);
  }

  function hashSeed(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619) >>> 0;
    return h;
  }

  function buildBars(countries) {
    if (!countries) return [];
    return countries.features
      .map(f => {
        const props = f.properties;
        const name = props.ADMIN || props.NAME;
        const iso = props.ISO_A2;
        const data = NEWS_DATA[name] || NEWS_DATA[iso];
        if (!data) return null;

        // "热度" = 近2天该国各类的原始命中数（区分度远高于留下的5条）。
        // 没有 _intensity（静态 fallback 数据）时退回按留下的条数算。
        const intensity = data._intensity;
        const counts = {};
        let hot = 0;        // 总热度 → 决定光柱高度
        let maxCount = 0;
        for (const [, key] of CATEGORIES) {
          const c = intensity ? (intensity[key] || 0) : (data[key] || []).length;
          counts[key] = c;
          hot += c;
          if (c > maxCount) maxCount = c;
        }
        if (hot === 0) return null;

        // Tied categories at the max → pick deterministically by ISO hash so each country gets a stable, distinct color
        const tiedKeys = CATEGORIES.map(([, k]) => k).filter(k => counts[k] === maxCount);
        const seed = iso || name || '';
        const dominantKey = tiedKeys.length === 1
          ? tiedKeys[0]
          : tiedKeys[hashSeed(seed) % tiedKeys.length];
        const dominantLabel = CATEGORIES.find(([, k]) => k === dominantKey)[0];

        // 面板里展示的"条数" = 实际留下的新闻数
        const itemCount = CATEGORIES.reduce((n, [, k]) => n + (data[k] || []).length, 0);

        const [lng, lat] = polygonCenter(f);
        // 对数缩放：大新闻国（中/美）不会把小国压成一片平地，又拉开可见高低差
        // （实测当日热度 40–337，映射到约 0.018–0.077；floor/cap 兜住其它日子的离群值）
        const a = Math.log1p(hot) * 0.028 - 0.086;
        return {
          lat, lng,
          total: itemCount,
          intensity: hot,
          country: name,
          dominantLabel,
          color: CATEGORY_COLORS[dominantKey] || CATEGORY_COLORS.economy,
          altitude: Math.max(0.008, Math.min(a, 0.085)),
        };
      })
      .filter(Boolean);
  }

  function refreshBars() {
    if (!world) return;
    if (viewMode === 'cn' && cnGeo) {
      world.pointsData(buildProvinceBars(cnProvinceFeatures()));
    } else if (allCountries) {
      world.pointsData(buildBars(allCountries));
    }
  }

  function reshowSelected() {
    if (!selectedFeat) return;
    if (viewMode === 'cn') showProvinceNews(selectedFeat);
    else showNews(selectedFeat);
  }

  function hasNews(feat) {
    if (viewMode === 'cn') {
      const p = cnNews && cnNews.provinces[feat.properties.name];
      return Boolean(p && p.items && p.items.length);
    }
    const name = feat.properties.ADMIN || feat.properties.NAME;
    const iso = feat.properties.ISO_A2;
    return Boolean(NEWS_DATA[name] || NEWS_DATA[iso]);
  }

  function highlightSelected() {
    const lift = viewMode === 'cn' ? 0.04 : 0.06;
    world.polygonAltitude(f => f === selectedFeat ? lift : 0.006)
         .polygonCapColor(f => f === selectedFeat
           ? 'rgba(201, 169, 110, 0.55)'
           : (hasNews(f) ? 'rgba(201, 169, 110, 0.12)' : 'rgba(255, 255, 255, 0.02)'));
  }

  function selectCountry(feat) {
    selectedFeat = feat;
    highlightSelected();
    showNews(feat);
    const [lng, lat] = polygonCenter(feat);
    world.pointOfView({ lat, lng, altitude: 1.8 }, 1000);
  }

  function selectProvince(feat) {
    selectedFeat = feat;
    highlightSelected();
    showProvinceNews(feat);
    const c = feat.properties.centroid || feat.properties.center;
    const [lng, lat] = c ? [c[0], c[1]] : polygonCenter(feat);
    world.pointOfView({ lat, lng, altitude: 0.6 }, 1000);
  }

  // ---------- 中国省级下钻 ----------
  function cnProvinceFeatures() {
    return cnGeo.features.filter(f => f.properties.level === 'province' && f.properties.name);
  }

  function loadCN() {
    const needGeo = cnGeo ? Promise.resolve(cnGeo)
      : fetch('assets/china-provinces.geojson?v=2').then(r => r.json());  // v=2: 简化版，绕开旧缓存
    const needNews = cnNews ? Promise.resolve(cnNews)
      : fetch('news-cn.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    return Promise.all([needGeo, needNews]).then(([g, n]) => { cnGeo = g; cnNews = n; });
  }

  function enterCNDrill() {
    loadCN().then(() => {
      if (!cnGeo || !cnNews) return;   // 数据没就绪则留在全球视图
      viewMode = 'cn';
      selectedFeat = null;
      const feats = cnProvinceFeatures();
      world.polygonsData(feats)
           .polygonAltitude(0.006)
           .polygonCapColor(f => hasNews(f) ? 'rgba(201, 169, 110, 0.12)' : 'rgba(255, 255, 255, 0.02)')
           .pointsData(buildProvinceBars(feats));
      world.pointOfView({ lat: 34, lng: 104, altitude: 1.1 }, 1000);
      const panel = document.getElementById('panel');
      panel.classList.remove('collapsed');
      document.getElementById('toggle').textContent = '隐藏面板';
      showDrillIntro();
    });
  }

  function exitDrill() {
    viewMode = 'global';
    selectedFeat = null;
    world.polygonsData(allCountries.features.filter(f => f.properties.ISO_A2 !== 'AQ'))
         .polygonAltitude(0.006)
         .polygonCapColor(f => hasNews(f) ? 'rgba(201, 169, 110, 0.12)' : 'rgba(255, 255, 255, 0.02)')
         .pointsData(buildBars(allCountries));
    world.pointOfView({ lat: 30, lng: 110, altitude: 2.5 }, 1000);
    document.getElementById('region').innerHTML = `
      <span class="iso">— 等待选择 —</span>
      请点击地球上任意国家
      <span class="hint">鼠标左键拖动旋转 · 滚轮缩放</span>
    `;
    document.getElementById('news').innerHTML = '';
  }

  function buildProvinceBars(feats) {
    return feats.map(f => {
      const name = f.properties.name;
      const p = cnNews && cnNews.provinces[name];
      const hot = p ? (p._intensity || 0) : 0;
      if (!hot) return null;
      const c = f.properties.centroid || f.properties.center;
      if (!c) return null;
      // 省级热度=近12h条数，区间约 12–74（比国家级窄），单独标定一条更陡的曲线
      const a = Math.log1p(hot) * 0.033 - 0.0725;
      return {
        lat: c[1], lng: c[0],
        intensity: hot,
        total: p.items.length,
        country: name,
        dominantLabel: '综合',
        color: 'rgba(201, 169, 110, 0.9)',
        altitude: Math.max(0.008, Math.min(a, 0.085)),
      };
    }).filter(Boolean);
  }

  function renderItem(item) {
    const inner = `${item.title}<span class="time">${item.time}${item.source ? ' · ' + item.source : ''}</span>`;
    return item.url
      ? `<a class="news-item" href="${item.url}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="news-item">${inner}</div>`;
  }

  function bindNav() {
    const back = document.getElementById('back-btn');
    if (back) back.onclick = exitDrill;
    const drill = document.getElementById('drill-btn');
    if (drill) drill.onclick = enterCNDrill;
  }

  function showDrillIntro() {
    document.getElementById('region').innerHTML = `
      <span class="iso">中国 · 省级</span>
      各省热点
      <span class="hint">点击地图上的省份查看该省综合新闻</span>
      <span class="nav" id="back-btn">← 返回全球</span>
    `;
    document.getElementById('news').innerHTML =
      '<div class="empty">点击地图上的省份，查看该省今日综合热点。</div>';
    bindNav();
  }

  function showProvinceNews(feat) {
    const name = feat.properties.name;
    const p = cnNews && cnNews.provinces[name];
    const region = document.getElementById('region');
    const news = document.getElementById('news');
    region.innerHTML = `
      <span class="iso">中国 · 省级</span>
      ${name}
      <span class="hint">${(p && p._meta) || ''} · 综合热点</span>
      <span class="nav" id="back-btn">← 返回全球</span>
    `;
    if (!p || !p.items || !p.items.length) {
      news.innerHTML = '<div class="empty">该省暂无近期新闻。</div>';
    } else {
      news.innerHTML = `<div class="cat">${p.items.map(renderItem).join('')}</div>`;
    }
    bindNav();
  }

  function polygonCenter(feat) {
    const coords = feat.geometry.coordinates;
    let lngs = [], lats = [];
    const walk = arr => {
      if (typeof arr[0] === 'number') {
        lngs.push(arr[0]); lats.push(arr[1]);
      } else { arr.forEach(walk); }
    };
    walk(coords);
    return [
      lngs.reduce((a,b)=>a+b,0)/lngs.length,
      lats.reduce((a,b)=>a+b,0)/lats.length
    ];
  }

  function showNews(feat) {
    const props = feat.properties;
    const name = props.ADMIN || props.NAME;
    const iso = props.ISO_A2;
    const data = NEWS_DATA[name] || NEWS_DATA[iso];

    const region = document.getElementById('region');
    const news = document.getElementById('news');

    if (!data) {
      region.innerHTML = `
        <span class="iso">${iso || '—'}</span>
        ${name}
        <span class="hint">该地区暂未收录新闻（MVP 演示，仅覆盖重点国家）</span>
      `;
      news.innerHTML = `
        <div class="empty">
          正式版接入 RSS 后将覆盖全球。<br>
          演示阶段可点击：中国、美国、俄罗斯、日本、德国、英国、法国、印度、韩国、乌克兰、以色列。
        </div>
      `;
      return;
    }

    region.innerHTML = `
      <span class="iso">${iso || '—'}</span>
      ${name}
      <span class="hint">${data._meta || '今日要闻 · 五大类'}</span>
      ${iso === 'CN' ? '<span class="nav" id="drill-btn">下钻到省份 →</span>' : ''}
    `;

    news.innerHTML = CATEGORIES.map(([label, key]) => {
      const items = data[key] || [];
      return `<div class="cat">
        <h2>${label}<span class="count">${items.length ? `(${items.length})` : ''}</span></h2>
        ${items.length === 0 ? '<div class="empty">暂无</div>' : items.map(renderItem).join('')}
      </div>`;
    }).join('');
    bindNav();
  }
</script>
</body>
</html>
